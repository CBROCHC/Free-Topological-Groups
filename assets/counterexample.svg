<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="t d">
<title id="t">A subgroup that is not free</title><desc id="d">Sequence 1/n converging to 0 and the contradiction with a discrete free group</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2B2B2B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A6192E"/></marker></defs>
<rect x="1" y="1" width="998" height="498" rx="14" fill="#FFFFFF" stroke="#E7D3D7" stroke-width="2"/>
<path d="M1,64 V15 a14,14 0 0 1 14,-14 H985 a14,14 0 0 1 14,14 V64 z" fill="#A6192E"/>
<text x="500.0" y="41.0" font-family="'Latin Modern Roman','STIX Two Text','Cambria','Times New Roman',serif" font-size="28" text-anchor="middle" fill="#FFFFFF" font-weight="normal" font-style="normal">A subgroup that is not free</text>
<text x="60" y="98" font-family="'Latin Modern Roman','STIX Two Text','Cambria','Times New Roman',serif" font-size="22" text-anchor="start" fill="#2B2B2B" font-weight="bold" font-style="normal">X = { 1/n : n ∈ ℕ } ∪ { 0 }  ⊂ ℝ</text>
<line x1="60" y1="150" x2="940" y2="150" stroke="#9A8E90" stroke-width="2"/>
<circle cx="880.0" cy="150" r="6" fill="#6B74C9"/>
<text x="880.0" y="180" font-family="'Latin Modern Roman','STIX Two Text','Cambria','Times New Roman',serif" font-size="17" text-anchor="middle" fill="#2B2B2B" font-weight="normal" font-style="normal">1</text>
<circle cx="480.0" cy="150" r="6" fill="#6B74C9"/>
<text x="480.0" y="180" font-family="'Latin Modern Roman','STIX Two Text','Cambria','Times New Roman',serif" font-size="17" text-anchor="middle" fill="#2B2B2B" font-weight="normal" font-style="normal">1/2</text>
<circle cx="346.7" cy="150" r="6" fill="#6B74C9"/>
<text x="346.7" y="180" font-family="'Latin Modern Roman','STIX Two Text','Cambria','Times New Roman',serif" font-size="17" text-anchor="middle" fill="#2B2B2B" font-weight="normal" font-style="normal">1/3</text>
<circle cx="280.0" cy="150" r="6" fill="#6B74C9"/>
<text x="280.0" y="180" font-family="'Latin Modern Roman','STIX Two Text','Cambria','Times New Roman',serif" font-size="17" text-anchor="middle" fill="#2B2B2B" font-weight="normal" font-style="normal">1/4</text>
<circle cx="240.0" cy="150" r="6" fill="#6B74C9"/>
<circle cx="213.3" cy="150" r="6" fill="#6B74C9"/>
<circle cx="194.3" cy="150" r="6" fill="#6B74C9"/>
<circle cx="180.0" cy="150" r="6" fill="#6B74C9"/>
<circle cx="168.9" cy="150" r="6" fill="#6B74C9"/>
<circle cx="160.0" cy="150" r="6" fill="#6B74C9"/>
<circle cx="146.7" cy="150" r="6" fill="#6B74C9"/>
<circle cx="137.1" cy="150" r="6" fill="#6B74C9"/>
<circle cx="127.1" cy="150" r="6" fill="#6B74C9"/>
<circle cx="116.4" cy="150" r="6" fill="#6B74C9"/>
<circle cx="106.7" cy="150" r="6" fill="#6B74C9"/>
<circle cx="80" cy="150" r="8" fill="#FFFFFF" stroke="#A6192E" stroke-width="3"/>
<text x="80" y="180" font-family="'Latin Modern Roman','STIX Two Text','Cambria','Times New Roman',serif" font-size="18" text-anchor="middle" fill="#A6192E" font-weight="bold" font-style="normal">0</text>
<line x1="420" y1="134" x2="150" y2="134" stroke="#A6192E" stroke-width="2" marker-end="url(#ac)"/>
<text x="285" y="126" font-family="'Latin Modern Roman','STIX Two Text','Cambria','Times New Roman',serif" font-size="18" text-anchor="middle" fill="#2B2B2B" font-weight="normal" font-style="italic">1/n → 0</text>
<line x1="500" y1="200" x2="500" y2="232" stroke="#2B2B2B" stroke-width="2" marker-end="url(#a)"/>
<rect x="250" y="234" width="500" height="50" rx="12" fill="#E4E7FA" stroke="#6B74C9" stroke-width="2"/>
<text x="500.0" y="265.27" font-family="'Latin Modern Roman','STIX Two Text','Cambria','Times New Roman',serif" font-size="19" text-anchor="middle" fill="#2B2B2B" font-weight="normal" font-style="normal">In A(X) the generators 1/n converge to the generator 0</text>
<line x1="380" y1="286" x2="260" y2="322" stroke="#2B2B2B" stroke-width="2" marker-end="url(#a)"/>
<line x1="620" y1="286" x2="740" y2="322" stroke="#2B2B2B" stroke-width="2" marker-end="url(#a)"/>
<rect x="40" y="324" width="430" height="100" rx="12" fill="#FFEAD4" stroke="#D98A3A" stroke-width="2"/>
<text x="255.0" y="355.57" font-family="'Latin Modern Roman','STIX Two Text','Cambria','Times New Roman',serif" font-size="19" text-anchor="middle" fill="#2B2B2B" font-weight="normal" font-style="normal">H = ⟨Y⟩ ≤ A(X),  subspace topology</text>
<text x="255.0" y="380.27" font-family="'Latin Modern Roman','STIX Two Text','Cambria','Times New Roman',serif" font-size="19" text-anchor="middle" fill="#2B2B2B" font-weight="normal" font-style="normal">1/n − 1/(n+1) → 0 in H</text>
<text x="255.0" y="404.96999999999997" font-family="'Latin Modern Roman','STIX Two Text','Cambria','Times New Roman',serif" font-size="19" text-anchor="middle" fill="#2B2B2B" font-weight="normal" font-style="normal">non-trivial convergent sequence</text>
<rect x="530" y="324" width="430" height="100" rx="12" fill="#E0F5E0" stroke="#4C9A4C" stroke-width="2"/>
<text x="745.0" y="355.57" font-family="'Latin Modern Roman','STIX Two Text','Cambria','Times New Roman',serif" font-size="19" text-anchor="middle" fill="#2B2B2B" font-weight="normal" font-style="normal">A(Y),  Y = {1/n} is discrete</text>
<text x="745.0" y="380.27" font-family="'Latin Modern Roman','STIX Two Text','Cambria','Times New Roman',serif" font-size="19" text-anchor="middle" fill="#2B2B2B" font-weight="normal" font-style="normal">A(Y) is discrete</text>
<text x="745.0" y="404.96999999999997" font-family="'Latin Modern Roman','STIX Two Text','Cambria','Times New Roman',serif" font-size="19" text-anchor="middle" fill="#2B2B2B" font-weight="normal" font-style="normal">no non-trivial convergent sequences</text>
<text x="500" y="382" font-family="'Latin Modern Roman','STIX Two Text','Cambria','Times New Roman',serif" font-size="46" text-anchor="middle" fill="#A6192E" font-weight="bold" font-style="normal">≠</text>
<rect x="150" y="440" width="700" height="44" rx="12" fill="#FDE6EA" stroke="#C23B5A" stroke-width="2"/>
<text x="500.0" y="468.6" font-family="'Latin Modern Roman','STIX Two Text','Cambria','Times New Roman',serif" font-size="20" text-anchor="middle" fill="#2B2B2B" font-weight="bold" font-style="normal">Therefore H is not the free abelian topological group on Y  ∎</text>
</svg>
